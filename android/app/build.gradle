// Kingdom Kart for Android: the Wii U game's own code (C), built with SDL for the phone.
apply plugin: 'com.android.application'

android {
    namespace "com.seanmallan.kingdomkart"
    compileSdkVersion 34
    ndkVersion System.getenv("KK_NDK_VERSION") ?: "26.3.11579264"
    defaultConfig {
        applicationId "com.seanmallan.kingdomkart"
        minSdkVersion 24
        targetSdkVersion 34
        versionCode Integer.parseInt(System.getenv("KK_VERSION_CODE") ?: "1")
        versionName "2.0." + (System.getenv("KK_VERSION_CODE") ?: "1")
        externalNativeBuild {
            cmake {
                arguments "-DANDROID_APP_PLATFORM=android-24", "-DANDROID_STL=c++_static", "-DWIIU_SRC=" + (System.getenv("KK_WIIU_SRC") ?: "")
                abiFilters 'arm64-v8a'
            }
        }
    }
    signingConfigs {
        release {
            storeFile file(System.getenv("KK_KEYSTORE") ?: "none")
            storePassword System.getenv("KK_KEYSTORE_PASS") ?: ""
            keyAlias "kingdomkart"
            keyPassword System.getenv("KK_KEYSTORE_PASS") ?: ""
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
    externalNativeBuild {
        cmake {
            path 'jni/CMakeLists.txt'
        }
    }
    androidResources {
        noCompress 'mp3', 'png', 'jpg', 'wav', 'ogv'   /* already packed; leaving them as they are makes the first start faster */
    }
    lint {
        abortOnError false
    }
}
